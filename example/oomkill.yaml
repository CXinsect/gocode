programs:
  - name: OOMKill
    metrics:
      counters:
        - name: oomkill
          help: The Counters Of System's OOMKill
          table: oom_collect
          labels:
            - name: oomkill
              size: 8
              decoders:
                - name: uint
    uprobes:
      main.oom_kill_process: kprobe_oom_kill_process
    code: |
      #include <uapi/linux/ptrace.h>
      #include <linux/oom.h>

      BPF_HASH(oom_collect, u64);

      void kprobe_oom_kill_process(struct pt_regs *ctx) {
        u64 pid = bpf_get_current_pid_tgid() >> 32;
        oom_collect.increment(pid);
      }

      
     