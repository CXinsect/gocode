apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-Service
  namespace: {{ .Release.Namespace }}
  labels:
    instance: prom-service
spec:
  type: {{ .Values.service.type }}
  ports:
  - port: {{ .Values.service.port }}
    protocol: TCP
    targetPort: metrics
  selector:
     instance: {{ .Release.Name }} 
  