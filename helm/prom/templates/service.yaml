apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-service
  namespace: {{ .Release.Namespace }}
  labels:
    instance: prom-service
spec:
  type: {{ .Values.service.type }}
  ports:
  - name: web
    port: {{ .Values.service.port }}
    protocol: TCP
    targetPort: metrics
    nodePort: {{ .Values.service.nodePort }}
  selector:
     instance: {{ .Release.Name }} 
  